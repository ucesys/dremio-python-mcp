[project]
name = "minio_mcp_server"
version = "0.1.0"
description = "Model-Context Protocol (MCP) server and client for MinIO"


[[project.authors]]
name = "Nikita Makarov"
email = "nima0713@gmail.com"

dependencies = [
    "mcp>=1.6.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-dremio-server = "mcp_dremio_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]